<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>약관 · 정책 · 한지붕</title>
<meta name="robots" content="index,follow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--g900:#191F28;--g700:#4E5968;--g600:#6B7684;--g500:#8B95A1;--g200:#E5E8EB;--g100:#F2F4F6;--g50:#F9FAFB;--blue:#3182F6;--brand:#3182F7}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--g100);color:var(--g900);font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;font-size:16px;line-height:1.7;letter-spacing:-.02em;word-break:keep-all;overflow-wrap:anywhere}
header{background:#fff;border-bottom:1px solid var(--g200)}
header div{max-width:720px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:8px}
header a{display:flex;align-items:center;gap:8px;color:#30243D;font-weight:700;font-size:18px;text-decoration:none}
header svg{width:24px;height:24px;flex:none}
main{max-width:720px;margin:0 auto;padding:12px 0 40px}
article{background:#fff;padding:28px 20px 32px}
@media(min-width:760px){main{padding:24px 0 56px}article{border-radius:20px;padding:40px 36px}}
h1{font-size:26px;font-weight:700;line-height:1.35;margin:0 0 20px}
h2{font-size:19px;font-weight:700;line-height:1.4;margin:36px 0 10px;padding-top:4px;scroll-margin-top:12px}
h3{font-size:17px;font-weight:600;margin:24px 0 8px;color:var(--g900)}
p{margin:10px 0;color:var(--g700)}
ul,ol{margin:10px 0;padding-left:20px;color:var(--g700)}
li{margin:6px 0}
b{color:var(--g900);font-weight:600}
a{color:var(--blue);text-underline-offset:3px}
code{font-family:inherit;background:var(--g100);border-radius:6px;padding:1px 6px;font-size:15px}
mark{background:#FFF6DC;color:#B07D00;border-radius:6px;padding:1px 6px}
.tw{overflow-x:auto;margin:12px -20px;padding:0 20px;-webkit-overflow-scrolling:touch}
@media(min-width:760px){.tw{margin:12px 0;padding:0}}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:15px;line-height:1.6}
th,td{border:1px solid var(--g200);padding:10px 12px;text-align:left;vertical-align:top;color:var(--g700)}
th{background:var(--g50);color:var(--g900);font-weight:600;white-space:nowrap}
footer{max-width:720px;margin:0 auto;padding:0 20px 40px;color:var(--g500);font-size:15px}
footer a{color:var(--g600)}
.list{list-style:none;padding:0;margin:0}
.list a{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-top:1px solid var(--g100);color:var(--g900);font-size:17px;font-weight:500;text-decoration:none}
.list li:first-child a{border-top:0}
.list a::after{content:'›';color:var(--g500);font-size:20px}
</style>
</head>
<body>
<header><div><a href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h2.6v2.3L12 3l9 7.6V20a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 20v-9.4l2-1.7z" fill="#3182F7"/><rect x="6.6" y="12" width="2.8" height="3.6" rx=".6" fill="#C4EDFF"/><rect x="10.6" y="12" width="2.8" height="3.6" rx=".6" fill="#C4EDFF"/><rect x="14.6" y="12" width="2.8" height="3.6" rx=".6" fill="#C4EDFF"/></svg>한지붕</a></div></header>
<main><article>
<h1>한지붕 약관 · 정책</h1>

</article></main>
<footer><a href="/terms">이용약관</a> · <a href="/privacy">개인정보처리방침</a> · <a href="/delete-account">계정 삭제 안내</a><br>문의 yuipoi270@gmail.com</footer>
</body>
</html>
